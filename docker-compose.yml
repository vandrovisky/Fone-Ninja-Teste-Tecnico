services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fone-ninja-backend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_KEY=base64:3fF6djSO2NQloBcCczeFhdrTiWuJ083YcsCXEQEUA7s=
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=fone_ninja
      - DB_USERNAME=fone_ninja
      - DB_PASSWORD=secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fone-ninja-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fone-ninja-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080/api
    networks:
      - fone-ninja-net

  db:
    image: mysql:8.0
    container_name: fone-ninja-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: fone_ninja
      MYSQL_USER: fone_ninja
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fone-ninja-net

networks:
  fone-ninja-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  backend_vendor:
    driver: local
